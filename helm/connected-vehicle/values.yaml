replicaCount: 2
image:
  repository: YOUR_ACR_NAME.azurecr.io/connected-vehicle-platform
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi
database:
  secretName: vehicle-db
  jdbcUrlKey: jdbc-url
  usernameKey: username
  passwordKey: password
