# Application
spring.application.name=connected-vehicle-platform
server.port=${SERVER_PORT:8070}

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vehicle_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vehicle_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:VehicleDev@2026!}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Database Migrations
spring.flyway.enabled=true

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Application Information
info.app.name=Connected Vehicle Telemetry & Health Platform
info.app.version=0.0.1